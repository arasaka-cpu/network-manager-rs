[package]
name = "network-manager-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT-0"
description = "Linux-native network management daemon foundation"

[lib]
name = "network_manager_rs"
path = "src/lib.rs"

[[bin]]
name = "nmd"
path = "src/bin/nmd.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zbus = { version = "5", features = ["p2p"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
